ikes:'人多的场合、拽专业名词的人、阳光直射',secret:['其实有一个用来取材的小圈子，里边全部都是各种哭唧唧的宅女画师。','因为个子不高，对于公共洗手间的镜子有怨念，因此作品里从不出现洗浴间剧情。','其实作品里的女角色都是胸大腿长，被外界误认为是一个高挑的冷艳御姐。','其实家里有很多不同品牌的木瓜牛奶。'],sisterNote:'去她家当模特？老哥你可悠着点，别被画进什么奇怪的本子里了。'},{id:'7',name:'椎名律',role:'小提琴天才',price:'¥3,000/天',color:'bg-pop-pink',avatar:'https://i.postimg.cc/0Np69H75/nai-4055558051.png',desc:'日本小提琴天才，性格张扬叛逆，喜欢恶作剧。因为觉得有趣而下载了APP看你的笑话。',tags:['天才','叛逆','恶作剧'],likes:'恶作剧、麻辣烫、夜晚便利店',dislikes:'正经场合、被说可惜、密码日记本',secret:['其实手机壁纸是被禁赛那天评委们的脸，看到他们不爽的脸就想笑。','其实只有左耳打了耳洞，因为怕疼宣布绝对不要再打洞。','其实很讨厌闹钟，觉得像节拍器在喊人起床练习，令人不爽。','其实对体重很在意，来到中国后胖了三斤，有微妙的不满却控制不住嘴。'],sisterNote:'这丫头一肚子坏水，小心点，别被她整蛊了！'},{id:'8',name:'温知晚',role:'舞蹈系学妹',price:'¥5,000/天',color:'bg-pop-cyan',avatar:'https://i.postimg.cc/25BpPsRQ/1000213271.png',desc:'燕大舞蹈系女生，温柔体面但内心压抑欲望，对你有好感并主动约见。',tags:['温柔','体面','压抑欲望'],likes:'凌晨的路灯、给别人泡茶、旧电影的吻戏、水袖扇舞',dislikes:'被当成仙女、刺眼的光、吵架',secret:['其实手机里有一个叫做\'宋词选读\'的便签文件夹，里边全是自己私下看的东西。','其实比起视觉更喜欢文字，因为可以发挥想象力，更有代入感。','其实给你发大胆消息前，做了很长时间的思想建设和反复删改。','其实最喜欢的那把木簪是小时候用小刀雕出来的，划伤手时罕见地大哭过。','其实发量太多洗头很苦恼，经常在想剪短和不想剪之间横跳。','其实几乎没接触过家人以外的男性，理论知识丰富，但毫无实践经验。'],sisterNote:'虽然温柔体贴，但是不要忘了这可是客户啊！'},{id:'9',name:'罗兰',role:'法国交换生',price:'¥10,000/天',color:'bg-white',textColor:'text-pop-black',avatar:'https://i.postimg.cc/HnZVHWtB/1000213897.png',desc:'法国交换生，你的小学同学，霍千黎的名义未婚夫。被人称为\'布列塔尼的守门人\'。',tags:['骑士','交换生','大剑'],likes:'高热量食物、《堂吉诃德》、煎饼摊',dislikes:'浓烈的香水味、被人从背后拍肩膀、阴雨天',secret:['其实是HEMA全法青年大赛的优胜者，每天都会小心翼翼地擦拭奖牌与奖杯。','其实睡觉的时候会打呼噜和说梦话，经常被霍千黎要求滚出房间睡地上。','其实喜欢闻旧皮革和布料的味道。','其实常用的剑起名叫杜兰达尔三世，前两把被她用怪力砸断。','其实小时候带着法国赌神口音，现在的普通话已经拿到一级甲等证书。'],sisterNote:'这家伙真是，明明是个女孩子还那么能打！'},{id:'10',name:'霍千黎',role:'金融系恶役千金',price:'¥10,000/天',color:'bg-pop-black',textColor:'text-white',avatar:'https://i.postimg.cc/RhsN9CTD/1000213899.png',desc:'燕大金融大三，你的小学同学。总是笑眯眯的恶役千金，罗兰的名义未婚妻。',tags:['恶役千金','笑面虎','腹黑'],likes:'猫、桌游、拍照、红茶、深夜广播',dislikes:'早起、拆卡包出平卡、被当成有心机的女人',secret:['其实很怕虫子，小时候郊游被蟑螂吓得跳上桌子，至今包里常备杀虫剂，甚至讨厌蜘蛛侠。','其实是昼伏夜出型，与罗兰同居后才逐步适应正常作息。','其实收集了你很多糗照，对外说是把柄，实际上每天都会坐在书桌前翻看。','其实有认真研究过为什么罗兰胸部发育良好还不影响运
